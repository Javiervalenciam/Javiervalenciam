<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" fill="none">
<title id="t">Javier Valencia — Soluciones reales con tecnología</title><desc id="d">Portada editorial: titular animado, áreas de trabajo y una ilustración de montañas en duotono terracota con cuadros de color.</desc>
<style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, monospace}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1.2s ease both}
.draw{animation:draw 1.6s cubic-bezier(.6,0,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:var(--len,400)}to{stroke-dashoffset:0}}

.w1,.w2,.w3{opacity:0}
.cyc{animation:cyc 12s infinite both}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}3%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-6px)}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hl{animation:hl 7.5s infinite both}
@keyframes hl{0%,16%{fill:#D2693F}22%,100%{fill:#ABA49A}}
.tw{animation:tw 3.6s ease-in-out infinite both}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.up,.fade,.draw{animation:none!important}.cyc,.blink,.hl,.tw{animation:none!important}}</style>
<rect x=".5" y=".5" width="1199" height="559" rx="22" fill="#0F1216" stroke="#262B33"/>
<radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 280) scale(520 360)"><stop stop-color="#D2693F" stop-opacity=".09"/><stop offset="1" stop-color="#D2693F" stop-opacity="0"/></radialGradient>
<rect x="1" y="1" width="1198" height="558" rx="21" fill="url(#glow)"/>
<g class="fade"><rect x="64" y="44" width="9" height="9" fill="#34B27F"/><rect x="77" y="44" width="9" height="9" fill="#4C7DF0"/><rect x="90" y="44" width="9" height="9" fill="#D2693F"/><text x="112" y="53" class="mono" font-size="13" letter-spacing="3" fill="#F2EDE4">JAVIER VALENCIA</text><circle cx="692" cy="48.5" r="4.5" fill="#D2693F" class="tw"/><text x="1136" y="53" text-anchor="end" class="mono" font-size="12" letter-spacing="2.2" fill="#ABA49A">DESARROLLO · DATOS · IA · PENSIONES · AMBIENTE</text></g>
