<linearGradient id="shine" x1="150" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
  <stop stop-color="#D2693F"/><stop offset=".5" stop-color="#F3A57E"/><stop offset="1" stop-color="#D2693F"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-560 0;-560 0;620 0" keyTimes="0;.55;1" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<g class="up" style="animation-delay:.05s"><text x="64" y="146" class="mono" font-size="13" letter-spacing="2.5" fill="#D2693F">PRODUCT BUILDER · COLOMBIA</text></g>
<g class="up" style="animation-delay:.15s"><text x="62" y="228" class="sans" font-size="72" font-weight="700" letter-spacing="-1.6" fill="#F2EDE4">Soluciones reales</text></g>
<g class="up" style="animation-delay:.3s"><text x="62" y="308" class="sans" font-size="72" font-weight="700" letter-spacing="-1.6" fill="#F2EDE4">con <tspan fill="url(#shine)">tecnología</tspan><tspan fill="#D2693F">.</tspan></text></g>
<g class="up" style="animation-delay:.45s"><text x="64" y="362" class="sans" font-size="19" fill="#ABA49A">Combino mi experiencia en pensiones, gestión ambiental y</text><text x="64" y="391" class="sans" font-size="19" fill="#ABA49A">análisis de datos con el desarrollo de software e</text><text x="64" y="420" class="sans" font-size="19" fill="#ABA49A">inteligencia artificial para crear herramientas que</text><text x="64" y="449" class="sans" font-size="19" fill="#ABA49A">simplifican procesos y generan valor en el mundo real.</text></g>
<g class="up" style="animation-delay:.6s"><rect x="56" y="470" width="610" height="34" rx="8" fill="#14181D" stroke="#1D2229"/><text x="68" y="492" class="mono" font-size="15" fill="#6F6A63">› soluciones para </text><g class="cyc w0" style="animation-delay:0s"><text x="230" y="492" class="mono" font-size="15" fill="#D2693F">pensiones y seguridad social</text><rect x="486" y="479" width="8" height="17" fill="#D2693F" class="blink"/></g><g class="cyc w1" style="animation-delay:3s"><text x="230" y="492" class="mono" font-size="15" fill="#46D7A1">gestión ambiental</text><rect x="387" y="479" width="8" height="17" fill="#46D7A1" class="blink"/></g><g class="cyc w2" style="animation-delay:6s"><text x="230" y="492" class="mono" font-size="15" fill="#7FA3F5">análisis de datos</text><rect x="387" y="479" width="8" height="17" fill="#7FA3F5" class="blink"/></g><g class="cyc w3" style="animation-delay:9s"><text x="230" y="492" class="mono" font-size="15" fill="#F2EDE4">automatización con IA</text><rect x="423" y="479" width="8" height="17" fill="#F2EDE4" class="blink"/></g></g>

