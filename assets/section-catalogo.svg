<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-labelledby="t d" fill="none">
<title id="t">Todos los repositorios</title><desc id="d">Todos los repositorios</desc>
<style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, monospace}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1.2s ease both}
.draw{animation:draw 1.6s cubic-bezier(.6,0,.2,1) both}
