@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:var(--len,400)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.up,.fade,.draw{animation:none!important}}</style>
