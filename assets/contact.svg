<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d" fill="none">
<title id="t">Conectemos</title><desc id="d">Conectemos</desc>
<style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, monospace}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1.2s ease both}
.draw{animation:draw 1.6s cubic-bezier(.6,0,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:var(--len,400)}to{stroke-dashoffset:0}}
.tw{animation:tw 3.6s ease-in-out infinite both}@keyframes tw{0%,100%{opacity:1}50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.up,.fade,.draw{animation:none!important}.tw{animation:none!important}}</style>
<rect x=".5" y=".5" width="1199" height="269" rx="20" fill="#0F1216" stroke="#262B33"/><g class="up"><text x="56" y="62" class="mono" font-size="12" letter-spacing="2.5" fill="#D2693F">04 — CONTACTO</text><text x="56" y="108" class="sans" font-size="38" font-weight="700" letter-spacing="-.8" fill="#F2EDE4">Conectemos</text><text x="56" y="150" class="sans" font-size="18" fill="#ABA49A">Si te interesa colaborar en proyectos, tienes una idea o</text><text x="56" y="178" class="sans" font-size="18" fill="#ABA49A">simplemente quieres conversar sobre tecnología, pensiones,</text><text x="56" y="206" class="sans" font-size="18" fill="#ABA49A">medio ambiente o IA, estaré encantado de hablar contigo.</text></g><path d="M760 64V210" stroke="#D2693F" stroke-width="2.5" class="draw" style="--len:146;stroke-dasharray:146;animation-delay:.3s"/><g class="up" style="animation-delay:.4s"><text x="792" y="98" class="sans" font-size="22" fill="#F2EDE4" font-style="italic">“La tecnología tiene más sentido</text><text x="792" y="132" class="sans" font-size="22" fill="#F2EDE4" font-style="italic">cuando resuelve problemas reales</text><text x="792" y="166" class="sans" font-size="22" fill="#F2EDE4" font-style="italic">de personas reales.”</text><text x="792" y="206" class="mono" font-size="11.5" letter-spacing="2.5" fill="#6F6A63">— JAVIER VALENCIA</text></g><rect x="1112" y="30" width="10" height="10" fill="#34B27F" class="tw" style="animation-delay:0.0s"/><rect x="1126" y="30" width="10" height="10" fill="#4C7DF0" class="tw" style="animation-delay:0.5s"/><rect x="1140" y="30" width="10" height="10" fill="#D2693F" class="tw" style="animation-delay:1.0s"/><rect x="1112" y="44" width="10" height="10" fill="#4C7DF0" class="tw" style="animation-delay:1.5s"/><rect x="1126" y="44" width="10" height="10" fill="#D2693F" class="tw" style="animation-delay:2.0s"/><rect x="1140" y="44" width="10" height="10" fill="#34B27F" class="tw" style="animation-delay:2.5s"/>
</svg>
